name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [clang, gcc]
        exclude:
          - os: macos-latest
            cc: gcc

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake

    - name: Verify style and characters
      run: |
        make check-style

    - name: Build Obelisk with Make
      env:
        CC: ${{ matrix.cc }}
      run: |
        make all

    - name: Run C Unit Tests
      run: |
        make unit-tests

    - name: Run Python Integration Tests
      run: |
        make integration-tests

    - name: Build with CMake
      run: |
        mkdir -p build_cmake
        cd build_cmake
        cmake .. -DCMAKE_C_COMPILER=${{ matrix.cc }}
        cmake --build .
        ctest --output-on-failure
